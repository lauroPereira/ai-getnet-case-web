<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<button id="login" hidden>Entrar</button><span id="notice"></span>
<script>
// Two roles. In the interface: the Entrar button opens the issuer's login in a popup and waits for the redirect.
// In the popup (the redirect URI, another Streamlit session): hands the redirect parameters to the waiting tab over
// a same-origin BroadcastChannel. Only the waiting session holds the verifier and validates state and iss.
// Streamlit may render a component more than once, so each side acts once: the popup publishes once, and the tab
// hands the server at most one value per attempt (state).
const send = (type, extra = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 45});
const notice = text => { document.getElementById("notice").textContent = text; };
let channel;
let published = false;   // popup: the redirect went out
let current = null;      // tab: the state of the attempt on the button
let answered = null;     // tab: the state already handed to the server
let popup = null;        // tab: the login window, closed by the tab that opened it
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
  const args = event.data.args;
  if (!channel) channel = new BroadcastChannel("getnet-oauth-callback-v1");
  if (args.callback) {
    if (published) return;
    published = true;
    channel.postMessage(args.callback);
    channel.close();
    // The tab closes this window; a sandboxed component frame cannot (the browser blocks it), hence the fallback.
    notice("Pode fechar esta janela e voltar ao atendimento.");
    try { window.parent.history.replaceState(null, "", window.parent.location.pathname); } catch (_) {}
    return;
  }
  // Another tab's login is not this tab's business: only the redirect for this attempt goes to the server,
  // which validates it again.
  const expected = new URL(args.url).searchParams.get("state");
  if (expected !== current) { current = expected; notice(""); }
  // The deadline is counted from this render in the browser's own clock: a tab left open past it asks the server
  // for a new attempt instead of opening the login with a stale state and verifier.
  const deadline = Date.now() + args.expires_in_ms;
  const button = document.getElementById("login");
  button.hidden = false;
  button.onclick = () => {
    if (answered === expected) return;
    if (Date.now() >= deadline) {
      answered = expected;
      send("streamlit:setComponentValue", {value: {expired: true}, dataType: "json"});
      return;
    }
    popup = window.open(args.url, "getnet_login", "popup,width=520,height=720");
    if (!popup) notice("Permita janelas de login neste navegador.");
  };
  channel.onmessage = event => {
    const state = event.data && event.data.state;
    if (!Array.isArray(state) || state[0] !== expected || answered === expected) return;
    answered = expected;
    try { if (popup && !popup.closed) popup.close(); } catch (_) {}
    popup = null;
    send("streamlit:setComponentValue", {value: event.data, dataType: "json"});
  };
});
</script></body></html>
